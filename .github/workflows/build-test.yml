# yupiter - build and test
#
# The library implements Linux on aarch64 and Linux on x86_64.  Every
# row runs on a native runner of the architecture it tests, so nothing
# here is cross-compiled and no emulator stands between the test
# programs and the kernel.
#
# The matrix covers what the build claims to support:
#
#   * both compilers, GNU and Clang;
#   * Debug and RelWithDebInfo, plus one Release row and the smallest
#     arena the configure script accepts (64 bytes), so an optimiser
#     cannot hide a path and the allocator boundary is exercised;
#   * the static library, the shared library and both, so a
#     configuration that disables one of them is still built and
#     inspected;
#   * an arena that holds a handful of blocks rather than one.
#
# The golden-file job regenerates expected-format.txt from the host C
# library on both architectures, so the file cannot drift into being a
# snapshot of what yupiter itself now prints.  The guard job checks the
# configure script's refusals and its architecture aliases.

name: build and test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.arch }} ${{ matrix.compiler }} ${{ matrix.build_type }} (${{ matrix.libraries }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ordinary rows: both libraries, both compilers, both
          # architectures, with the default arena.
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared
          - arch: aarch64
            runner: ubuntu-26.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared
          - arch: aarch64
            runner: ubuntu-26.04-arm
            compiler: clang
            cc: clang
            cxx: clang++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared

          # The smallest arena the build accepts, unoptimised.
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: debug
            heap_size: 64
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared
          - arch: aarch64
            runner: ubuntu-26.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: debug
            heap_size: 64
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared

          # An arena that holds a handful of blocks rather than one.
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: relwithdebinfo
            heap_size: 192
            static: "yes"
            shared: "yes"
            tests: "yes"
            libraries: static+shared

          # Release, static only.  The tests link the static archive,
          # so they still run.
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: release
            heap_size: 4096
            static: "yes"
            shared: "no"
            tests: "yes"
            libraries: static

          # Shared only, without the tests: the tests need the static
          # archive, so this row checks the object instead.
          - arch: x86_64
            runner: ubuntu-26.04
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "no"
            shared: "yes"
            tests: "no"
            libraries: shared
          - arch: aarch64
            runner: ubuntu-26.04-arm
            compiler: gcc
            cc: gcc
            cxx: g++
            build_type: relwithdebinfo
            heap_size: 4096
            static: "no"
            shared: "yes"
            tests: "no"
            libraries: shared
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: |
          ./configure \
              --cc="${{ matrix.cc }}" \
              --cxx="${{ matrix.cxx }}" \
              --build-type="${{ matrix.build_type }}" \
              --heap-size="${{ matrix.heap_size }}" \
              --enable-static="${{ matrix.static }}" \
              --enable-shared="${{ matrix.shared }}" \
              --enable-tests="${{ matrix.tests }}"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        if: matrix.tests == 'yes'
        run: make check

      # The shared-only rows cannot run "make check", because the test
      # programs link the static archive.  What matters there is that
      # the object exists, carries the SONAME the install rules promise
      # and exports the public interface.
      - name: Inspect the shared-only build
        if: matrix.tests == 'no'
        run: |
          version=$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' config.mk)
          test -n "$version"
          test -f "build/libyupiter.so.$version"
          test -L build/libyupiter.so.1
          test -L build/libyupiter.so
          readelf -d "build/libyupiter.so.$version" |
              grep -F 'SONAME' | grep -F 'libyupiter.so.1'
          nm -D --defined-only "build/libyupiter.so.$version" |
              grep -E ' T yupiter_(printf|fprintf|malloc|free|realloc)$'

  golden-files:
    name: golden files match the reference C library (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The conversion suite is compiled against the host C library,
      # from the same source and with the same calls, and its output is
      # compared with the golden file.  A change that makes yupiter
      # disagree with the reference library fails here, and so does a
      # golden file that was regenerated from yupiter instead.
      - name: Regenerate the conversion golden file from the reference
        run: |
          cc -std=c17 -DYUPITER_REFERENCE -w test/format.c \
              -o /tmp/reference-format
          /tmp/reference-format > /tmp/expected-format.txt
          diff -u test/expected-format.txt /tmp/expected-format.txt

  python-binding:
    name: python binding (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure and build yupiter
        run: |
          ./configure \
              --cc=gcc \
              --cxx=g++ \
              --build-type=relwithdebinfo \
              --heap-size=4096 \
              --enable-static=yes \
              --enable-shared=yes \
              --enable-tests=no
          make -j"$(nproc)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin patchelf

      - name: Build Python wheel
        run: |
          cd python
          maturin build --release --out dist

      - name: Install wheel
        run: pip install python/dist/yupiter-*.whl --break-system-packages

      - name: Run Python tests
        run: python test/test_python_binding.py

  configure-guard:
    name: the configure script refuses what it documents as impossible
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show the options
        run: ./configure --help

      - name: Reject an arena that cannot hold a block
        run: |
          for value in 0 1 32 63; do
            if ./configure --heap-size="$value" > /tmp/guard.log 2>&1; then
              echo "a heap of $value bytes was accepted"
              cat /tmp/guard.log
              exit 1
            fi
          done

      - name: Reject an arena that is not a number
        run: |
          for value in "" abc -1 1e3 4096x; do
            if ./configure --heap-size="$value" > /tmp/guard.log 2>&1; then
              echo "a heap of \"$value\" was accepted"
              cat /tmp/guard.log
              exit 1
            fi
          done

      - name: Reject an unknown build type
        run: |
          if ./configure --build-type=fast > /tmp/guard.log 2>&1; then
            echo "the build type \"fast\" was accepted"
            cat /tmp/guard.log
            exit 1
          fi

      - name: Reject a build with no library
        run: |
          if ./configure \
              --enable-static=no --enable-shared=no \
              > /tmp/guard.log 2>&1; then
            echo "a build with no library was accepted"
            cat /tmp/guard.log
            exit 1
          fi

      - name: Reject tests without the static archive
        run: |
          if ./configure \
              --enable-static=no --enable-shared=yes --enable-tests=yes \
              > /tmp/guard.log 2>&1; then
            echo "tests without the static archive were accepted"
            cat /tmp/guard.log
            exit 1
          fi

      - name: Reject an architecture that is not implemented
        run: |
          for arch in i686 arm riscv64 ppc64le; do
            if ./configure --arch="$arch" > /tmp/guard.log 2>&1; then
              echo "the architecture $arch was accepted"
              cat /tmp/guard.log
              exit 1
            fi
            grep -F "unsupported target architecture \"$arch\"" /tmp/guard.log
          done

      - name: Reject a compiler for another architecture
        run: |
          if ./configure --arch=aarch64 --cc=gcc --cxx=g++ \
              > /tmp/guard.log 2>&1; then
            echo "a native x86_64 compiler configured an aarch64 build"
            cat /tmp/guard.log
            exit 1
          fi
          grep -F 'not' /tmp/guard.log

      - name: Accept the alias spellings of the implemented architecture
        run: |
          for arch in x86_64 amd64 AMD64; do
            ./configure --arch="$arch" --enable-tests=no
            make -j"$(nproc)"
            make clean
          done
