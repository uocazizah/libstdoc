# libstdoc - build, test and verify on an x86_64 runner
#
# The library implements Linux on aarch64 and Linux on x86_64.  This is
# the workflow that builds and runs the x86_64 target: the runner is an
# x86_64 machine, so what it builds is what the library claims to
# support there, without a cross compiler and without an emulator.  The
# companion workflow (aarch64-linux-gnu-ubuntu-lts-26.04.yml) does the
# same for aarch64 on an aarch64 runner.
#
# Checked here are the build and the test suite under both compilers,
# with RelWithDebInfo for the ordinary rows and Debug for the
# smallest-arena row, at the arena sizes that matter at the boundary,
# the golden file of the conversion suite regenerated from a reference
# C library, and the architecture guard.  The arena guard is checked by
# the companion workflow instead, where an impossible arena is the only
# thing a configure can fail on.

name: build and test - native x86_64

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }} with a ${{ matrix.heap_size }} byte arena
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: RelWithDebInfo
            heap_size: 4096
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
            heap_size: 4096
          # The smallest arena the build accepts.  Everything the
          # library does with the heap has to survive it, including the
          # formatted calls that fall back to stack buffers.  This row
          # also keeps the unoptimised build exercised, where a code
          # path cannot hide behind the optimiser.
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
            heap_size: 64
          # An arena that holds a handful of blocks rather than one.
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: RelWithDebInfo
            heap_size: 192
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No CMAKE_SYSTEM_* values and no toolchain file: the runner is
      # x86_64 Linux, which is one of the two implemented targets, so
      # the ordinary native configure is a build of the target.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSTDOC_HEAP_SIZE=${{ matrix.heap_size }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  golden-files:
    name: golden files match the reference C library
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The conversion suite is compiled a second time against the host
      # C library, from the same source and with the same calls, and its
      # output is compared with the golden file.  A change that makes
      # libstdoc disagree with the reference library fails here, and so
      # does a golden file that was regenerated from libstdoc instead.
      #
      # Nothing about this depends on the architecture of either side,
      # which is why it runs here as well as on the aarch64 runner.
      - name: Regenerate the conversion golden file from the reference
        run: |
          cc -std=c17 -DSTDOC_REFERENCE -w test/format.c -o /tmp/reference-format
          /tmp/reference-format > /tmp/expected-format.txt
          diff -u test/expected-format.txt /tmp/expected-format.txt

  architecture-guard:
    name: the architecture guard accepts x86_64 and refuses the rest
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A native configure of this host accepts x86_64, which is what
      # the build job above does on every run.  What is checked here is
      # what that configure cannot reach: the spelling of the processor
      # is the only thing it can vary, so -DCMAKE_SYSTEM_PROCESSOR is
      # how this host can present an architecture other than its own.
      #
      # Every architecture that is not implemented has to be refused,
      # and the message has to name the one that was refused: a guard
      # that stopped the build with a message about something else
      # would leave the reader looking in the wrong place.
      #
      # Each processor gets a build directory of its own.  A failed
      # configure still writes CMAKE_SYSTEM_PROCESSOR into its cache,
      # and a second configure in the same directory would report the
      # processor that directory first saw rather than the one it was
      # just given.
      - name: Reject a configure for an architecture that is not implemented
        run: |
          for processor in i686 arm riscv64 ppc64le; do
            build_dir="/tmp/rejected-$processor"
            log="/tmp/guard-$processor.log"
            if cmake -S . -B "$build_dir" \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR="$processor" > "$log" 2>&1; then
              echo "a configure for $processor was accepted"
              cat "$log"
              exit 1
            fi
            grep -F "unsupported target architecture \"$processor\"" "$log"
          done

      # x86_64 is not the only spelling this architecture arrives under.
      # The aliases have to select the same startup file and the same
      # system-call trampoline as the canonical name, and the library
      # has to build with them; the aarch64 aliases are checked as far
      # as a configure goes, since this host has no aarch64 toolchain.
      - name: Accept the alias spellings of the implemented architectures
        run: |
          for processor in x86_64 amd64 AMD64; do
            cmake -S . -B "/tmp/accepted-$processor" \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR="$processor" \
                -DSTDOC_BUILD_TESTS=OFF
            cmake --build "/tmp/accepted-$processor" --parallel
          done
          for processor in arm64 ARM64; do
            cmake -S . -B "/tmp/accepted-$processor" \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR="$processor" \
                -DSTDOC_BUILD_TESTS=OFF
          done
