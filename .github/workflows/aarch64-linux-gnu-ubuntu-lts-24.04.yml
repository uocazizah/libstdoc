# libstdoc - build, test and verify on an aarch64 runner
#
# The library implements Linux on aarch64 and Linux on x86_64.  This is
# the workflow that builds and runs the aarch64 target: the runner is
# an aarch64 machine, so what it builds is what the library claims to
# support there, and nothing is cross-compiled.  The companion workflow
# (x86_64-linux-gnu-ubuntu-lts-24.04.yml) does the same for x86_64 on
# an x86_64 runner.
#
# Three things are checked here.  The build and the test suite run under
# both compilers and at the arena sizes that matter at the boundary.
# The golden file of the conversion suite is regenerated from a
# reference C library and compared, so it can never drift into being a
# snapshot of whatever libstdoc itself now prints.  The configuration
# guard is checked to reject the arena sizes it documents as impossible.
# The architecture guard is checked on the x86_64 side, where a
# configure for another processor can be asked for without changing the
# runner.

name: build and test - native aarch64

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} with a ${{ matrix.heap_size }} byte arena
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            heap_size: 4096
          - compiler: clang
            cc: clang
            cxx: clang++
            heap_size: 4096
          # The smallest arena the build accepts.  Everything the
          # library does with the heap has to survive it, including the
          # formatted calls that fall back to stack buffers.
          - compiler: gcc
            cc: gcc
            cxx: g++
            heap_size: 64
          # An arena that holds a handful of blocks rather than one.
          - compiler: gcc
            cc: gcc
            cxx: g++
            heap_size: 192
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSTDOC_HEAP_SIZE=${{ matrix.heap_size }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  golden-files:
    name: golden files match the reference C library
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The conversion suite is compiled a second time against the host
      # C library, from the same source and with the same calls, and its
      # output is compared with the golden file.  A change that makes
      # libstdoc disagree with the reference library fails here, and so
      # does a golden file that was regenerated from libstdoc instead.
      - name: Regenerate the conversion golden file from the reference
        run: |
          cc -std=c17 -DSTDOC_REFERENCE -w test/format.c -o /tmp/reference-format
          /tmp/reference-format > /tmp/expected-format.txt
          diff -u test/expected-format.txt /tmp/expected-format.txt

  configuration-guard:
    name: the configuration guard rejects impossible arenas
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject an arena that cannot hold a block
        run: |
          for value in 0 1 32 63; do
            if cmake -S . -B /tmp/rejected -DSTDOC_HEAP_SIZE="$value" > /dev/null 2>&1; then
              echo "STDOC_HEAP_SIZE=$value was accepted"
              exit 1
            fi
          done

      - name: Reject a value that is not a number
        run: |
          for value in "" abc -1 1e3 4096x; do
            if cmake -S . -B /tmp/rejected -DSTDOC_HEAP_SIZE="$value" > /dev/null 2>&1; then
              echo "STDOC_HEAP_SIZE=\"$value\" was accepted"
              exit 1
            fi
          done
